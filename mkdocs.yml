site_name: Linux EDR
site_description: Endpoint Detection and Response for Linux systems
site_url: https://github.com/yourusername/linux-edr

repo_name: linux-edr
repo_url: https://github.com/yourusername/linux-edr

theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - content.code.copy

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Architecture: architecture.md
  - API:
    - Trace Reader: api/trace.md
    - Aggregator: api/aggregator.md
    - Summary: api/summary.md
    - Reporter: api/reporter.md
  - Development: development.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.tasklist
  - admonition
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          selection:
            docstring_style: google
          rendering:
            show_source: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/linux-edr 